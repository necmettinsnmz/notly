<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notly — Ders Asistanı</title>
    <style>
      :root {
        --canvas: #090a0d;
        --surface: #111318;
        --surface-hover: #16181f;
        --border-subtle: rgba(255, 255, 255, 0.08);
        --text-primary: #f4f4f5;
        --text-muted: #8e939e;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --success: #10b981;
        --danger: #ef4444;
        --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
        background: var(--canvas);
        color: var(--text-primary);
        margin: 0;
        padding: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--border-subtle);
        margin-bottom: 14px;
      }
      .logo {
        font-weight: 750;
        font-size: 1rem;
        letter-spacing: -0.02em;
        color: var(--text-primary);
      }
      .btn {
        width: 100%;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
        background: var(--surface);
        color: var(--text-primary);
        font-weight: 600;
        font-size: 0.82rem;
        cursor: pointer;
        margin-bottom: 8px;
        text-align: left;
        transition: all 0.12s ease;
      }
      .btn:hover {
        background: var(--surface-hover);
        border-color: rgba(255, 255, 255, 0.18);
      }
      .btn-primary {
        background: var(--accent);
        border: 1px solid var(--accent-hover);
        color: #fff;
        text-align: center;
      }
      .btn-primary:hover {
        background: var(--accent-hover);
      }
      .btn-danger {
        background: rgba(239, 68, 68, 0.15);
        color: var(--danger);
        border-color: rgba(239, 68, 68, 0.35);
        text-align: center;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border-subtle);
        border-radius: 10px;
        padding: 12px;
        margin-top: 12px;
        font-size: 0.86rem;
      }
      .ts {
        font-family: var(--font-mono);
        background: rgba(59, 130, 246, 0.12);
        color: var(--accent);
        padding: 2px 5px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.74rem;
        font-weight: 700;
        border: 1px solid rgba(59, 130, 246, 0.25);
      }
      .ts:hover {
        background: var(--accent);
        color: #fff;
      }
      .slides {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        margin: 8px 0;
      }
      .slides img {
        width: 130px;
        border-radius: 6px;
        border: 1px solid var(--border-subtle);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">⚡ Notly Yan Panel</div>
      <span id="status-badge" style="font-size: 0.75rem; color: var(--success); font-family: var(--font-mono);">● Tasarruf Motoru</span>
    </div>

    <button class="btn" id="btn-capture-slide">📸 Şu Anki Ders Slaytını Nota Ekle</button>
    <button class="btn" id="btn-record-tab">🎙️ İndirilemeyen Dersin Sesini Dinle</button>
    <button class="btn btn-primary" id="btn-summarize-tab">✨ Bu Dersi Şimdi Özetle</button>

    <div id="slides-preview" class="slides"></div>
    <div id="output-area"></div>

    <script src="sidepanel.js"></script>
  </body>
</html>
