<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notly — Ders Asistanı</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0b1120;
        color: #f1f5f9;
        margin: 0;
        padding: 14px;
        line-height: 1.5;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        margin-bottom: 12px;
      }
      .logo {
        font-weight: 800;
        font-size: 1.1rem;
        color: #818cf8;
      }
      .btn {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: #1e293b;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 8px;
        text-align: left;
      }
      .btn-primary {
        background: linear-gradient(135deg, #6366f1, #7c3aed);
        border: none;
        text-align: center;
      }
      .btn-danger {
        background: #dc2626;
        border: none;
        text-align: center;
      }
      .card {
        background: #131c31;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 12px;
        margin-top: 12px;
      }
      .ts {
        font-family: monospace;
        background: rgba(99, 102, 241, 0.2);
        color: #a5b4fc;
        padding: 2px 6px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.8rem;
      }
      .slides {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        margin: 8px 0;
      }
      .slides img {
        width: 130px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">⚡ Notly Yan Panel</div>
      <span id="status-badge" style="font-size: 0.75rem; color: #10b981;">Tasarruf Motoru Aktif</span>
    </div>

    <button class="btn" id="btn-capture-slide">📸 Şu Anki Ders Slaytını Nota Ekle</button>
    <button class="btn" id="btn-record-tab">🎙️ İndirilemeyen Dersin Sesini Dinle</button>
    <button class="btn btn-primary" id="btn-summarize-tab">✨ Bu Dersi Şimdi Özetle</button>

    <div id="slides-preview" class="slides"></div>
    <div id="output-area"></div>

    <script src="sidepanel.js"></script>
  </body>
</html>
